project:
  name: te-geneformer-isp
  seed: 20261001
paths:
  raw_dir: runs/fish_gene_axis_20261001/raw
  processed_dir: runs/fish_gene_axis_20261001/processed
  tokenized_dir: runs/fish_gene_axis_20261001/tokenized
  models_dir: runs/fish_gene_axis_20261001/models
  dictionaries_dir: runs/fish_gene_axis_20261001/dictionaries
  isp_dir: runs/fish_gene_axis_20261001/isp
  te_map_dir: runs/fish_gene_axis_20261001/te_map
  tables_dir: runs/fish_gene_axis_20261001/tables
  figures_dir: runs/fish_gene_axis_20261001/figures
  logs_dir: runs/fish_gene_axis_20261001/logs
input:
  format: scte_h5ad
  path: data/raw/joint_gene_te_counts.h5ad
  counts_layer: null
  gene_id_type: symbol
  cell_metadata_tsv: null
  obs_keys:
    cell_id: cell_id
    donor: donor_id
    cell_type: cell_type
    condition: condition
    batch: batch
species:
  name: homo_sapiens
  orthology:
    enabled: false
    table: data/raw/orthologs_to_human.tsv
    source_id_col: source_gene_id
    human_ensembl_col: human_ensembl_id
    homology_type_col: homology_type
    keep_types:
    - ortholog_one2one
geneformer:
  repo_dir: ../Geneformer
  model_version: V2
  base_model_dir: ../Geneformer/Geneformer-V2-316M
  hidden_size: 1152
  model_input_size: 4096
  special_token: true
  dictionaries:
    token: ../Geneformer/geneformer/token_dictionary_gc104M.pkl
    gene_median: ../Geneformer/geneformer/gene_median_dictionary_gc104M.pkl
    gene_name_id: ../Geneformer/geneformer/gene_name_id_dict_gc104M.pkl
    ensembl_mapping: ../Geneformer/geneformer/ensembl_mapping_dict_gc104M.pkl
qc:
  min_genes: 500
  max_genes: 7000
  min_gene_counts: 1000
  max_pct_mito: 15.0
  mito_prefix: MT-
  min_cells_per_gene: 10
  max_pct_te_counts: 40.0
  doublet_obs_key: null
te:
  feature_detection:
    method: annotation
    annotation: data/raw/hg38_rmsk_TE.gtf
    var_column: feature_type
    var_value: te
    prefix: SoloTE|
  aggregation_level: family
  exclude_classes:
  - Simple_repeat
  - Low_complexity
  - Satellite
  - rRNA
  - tRNA
  - snRNA
  - scRNA
  - srpRNA
  - RNA
  keep_unknown: true
  min_cells_detected: 50
  score:
    method: log_cpm_sum
    families: all_strict
  state:
    key: te_state
    stratify_by:
    - cell_type
    low_quantile: 0.25
    high_quantile: 0.75
    labels:
      low: TE_low
      high: TE_high
      mid: TE_mid
    regress_out:
    - log_gene_counts
    - n_genes
  readout_families:
  - L1HS
  - L1PA2
  - L1PA3
  - AluYa5
  - AluYb8
  - SVA_E
  - SVA_F
  - HERVK-int
  - LTR5_Hs
  - HERVH-int
  - LTR7
  - MER41B
  readout_top_n: 50
vocab:
  mode: readout
  te_token_prefix: 'TE:'
split:
  key: split
  fractions:
    train: 0.7
    eval: 0.15
    test: 0.15
  min_donors_per_split: 3
  stratify_by: condition
classifier:
  state_key: te_state
  states:
  - TE_low
  - TE_high
  freeze_layers: 6
  forward_batch_size: 16
  nproc: 4
  training_args:
    num_train_epochs: 1
    learning_rate: 5.0e-05
    per_device_train_batch_size: 8
    lr_scheduler_type: linear
    warmup_steps: 100
    weight_decay: 0.001
    seed: 43
    save_strategy: epoch
    logging_steps: 50
    report_to: none
    bf16: true
  qc:
    n_bootstrap: 2000
    min_macro_f1: 0.65
    min_auroc: 0.7
    require_ci_above_majority: true
    confound_covariates:
    - log_gene_counts
    - n_genes
    - pct_mito
    min_margin_over_confound: 0.05
    max_abs_depth_rho: 0.3
    strata:
    - cell_type
    - condition
    min_cells_per_stratum: 100
    min_stratum_macro_f1: 0.55
    max_ece: 0.1
    max_tie_rate: 0.01
    max_centroid_cosine: 0.995
isp:
  perturb_types:
  - delete
  - overexpress
  emb_mode: cls
  emb_layer: 0
  forward_batch_size: 32
  nproc: 1
  max_ncells_per_target: 2000
  max_cells_per_donor: 100
  overexpress_require_expressed: true
  directions:
  - name: low_to_high
    start_state: TE_low
    goal_state: TE_high
    alt_states: []
  - name: high_to_low
    start_state: TE_high
    goal_state: TE_low
    alt_states: []
targets:
  krab_zfp_kap1:
    expected:
      delete: up
    genes:
    - TRIM28
    - SETDB1
    - ATF7IP
    - ZNF91
    - ZNF93
    - ZNF417
    - ZNF587
    - ZNF649
  hush_complex:
    expected:
      delete: up
    genes:
    - TASOR
    - MPHOSPH8
    - PPHLN1
    - MORC2
    - SETDB1
  dna_methylation:
    expected:
      delete: up
    genes:
    - DNMT1
    - DNMT3A
    - DNMT3B
    - UHRF1
  histone_h3k9_h3k27:
    expected:
      delete: up
    genes:
    - SUV39H1
    - SUV39H2
    - EHMT2
    - EZH2
    - KDM1A
  chromatin_remodel_h33:
    expected:
      delete: up
    genes:
    - DAXX
    - ATRX
    - SMARCAD1
    - CHAF1A
  rna_level_silencing:
    expected:
      delete: up
    genes:
    - METTL3
    - YTHDC1
    - SAFB
    - MOV10
    - TEX19
  te_activating_tfs:
    expected:
      overexpress: up
    genes:
    - YY1
    - RUNX3
    - MYC
    - DUX4
  genome_guardians:
    expected:
      delete: up
    genes:
    - TP53
    - RB1
positive_controls:
- TRIM28
- SETDB1
- DNMT1
readout_genes:
- IFIH1
- RIGI
- MAVS
- IRF7
- ISG15
- OAS1
- ZBP1
- CGAS
- STING1
null:
  n_genes_per_target: 20
  match_on:
  - detection_rate
  - mean_rank
  n_bins: 10
  exclude_groups: true
probe:
  model: ridge
  alphas:
  - 0.1
  - 1.0
  - 10.0
  - 100.0
  - 1000.0
  cv_folds: 5
  min_eval_r2: 0.05
  target_transform: log1p_cpm_zscore
  max_train_cells: 20000
analysis:
  aggregation_unit: donor
  min_cells_per_donor: 10
  min_donors: 3
  fdr: 0.05
  contrast_key: condition
  contrast_levels: null
  n_permutations: 1000
  network_edge_fdr: 0.05
  umap:
    n_neighbors: 30
    min_dist: 0.3
    metric: cosine
runtime:
  device: auto
  dtype: bf16
  canary:
    enabled: true
    n_targets: 10
    min_spearman: 0.95
    min_sign_agreement: 0.95
  resume: true
  log_level: INFO
bulk_validation:
  manifest: data/bulk/perturbation_studies.tsv
  columns:
    study_id: study_id
    run: run_accession
    role: role
    target: target_symbol
    perturbation: perturbation
    species: species
    sample_type: sample_type
    layout: layout
    strandedness: strandedness
  species:
  - homo_sapiens
  arm_of:
    KO: delete
    KD: delete
    CRISPRi: delete
    OE: overexpress
    CRISPRa: overexpress
  min_replicates: 2
  fastq_dir: data/bulk/fastq
  tecount_dir: data/bulk/tecount
  te_de_dir: data/bulk/te_de
  de_padj: 0.05
  de_min_abs_lfc: 0.5
  min_base_mean: 10
  baseline_min_cells_expressing: 50
bulk_isp:
  counts: /mnt/nas/kaisar/te-oa-full/counts-singlebatch/all
  samples: runs/fish_samples.tsv
  sample_id_col: sample_id
  gene_id_prefix: gene-
  exclude_where: null
  stratify_by:
  - tissue
  - treatment
  scale: true
  min_count: 10
  min_samples: 10
  extra_regulator_patterns:
  - ^znf438$
  alphas:
  - 1
  - 10
  - 100
  - 1000
  - 10000
  cv_folds: 5
  min_cv_r2: 0.05
  perturb_types:
  - delete
  - overexpress
  clamp_quantiles:
    delete: 0.01
    overexpress: 0.99
  n_steps: 3
  n_bootstrap: 200
  n_permutations: 1000
